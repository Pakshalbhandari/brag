[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
# "brag" is already taken on PyPI, so the distribution is published as
# "brag-rag". The import name and CLI command are both "brag".
name = "brag-rag"
dynamic = ["version"]
description = "RAG over PDF, DOCX, PPTX and XLSX with Docling, Chonkie and RAG-Anything"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pakshal" }]
keywords = ["rag", "retrieval-augmented-generation", "docling", "lightrag", "raganything", "office", "pdf", "docx", "pptx", "xlsx", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.14,<3",
    "chonkie>=1.7.0",
    "docling>=2.139.0",
    "openpyxl>=3.1.5",
    "lightrag-hku>=1.4.16,<1.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    # brag uses RAG-Anything's and LightRAG's storage layout and multimodal-status
    # cache; cap at the next minor so an upgrade cannot break installed copies.
    "raganything>=1.4.2,<1.5",
    "sentence-transformers>=6.1.0",
]

[project.optional-dependencies]
# Drivers for LightRAG storage backends (see KV_STORAGE, VECTOR_STORAGE, ...).
postgres = ["asyncpg>=0.31,<1"]
neo4j = ["neo4j>=5,<7"]
qdrant = ["qdrant-client>=1.11,<2"]
milvus = ["pymilvus>=2.6.2,<3"]
mongo = ["pymongo>=4,<5"]
redis = ["redis>=5,<8"]
# Client for Google Vertex AI (LLM_PROVIDER=vertex).
vertex = ["anthropic[vertex]>=2.14,<3"]

[dependency-groups]
dev = ["pytest>=8.3", "reportlab>=4.0"]

[project.urls]
Homepage = "https://github.com/Pakshalbhandari/brag"
Repository = "https://github.com/Pakshalbhandari/brag"
Issues = "https://github.com/Pakshalbhandari/brag/issues"

[project.scripts]
brag = "brag.cli:main"

[tool.hatch.version]
path = "src/brag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/brag"]

[tool.hatch.build.targets.sdist]
include = [
    "src/brag",
    "README.md",
    "pyproject.toml",
    ".env.example",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
