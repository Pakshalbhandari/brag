name: Evaluation

# Ingests samples/ and scores it against eval/samples.yaml. Calls the Claude API,
# so it only runs by hand: Actions -> Evaluation -> Run workflow.
# Needs the repository secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Query mode
        default: mix
        type: choice
        options: [mix, hybrid, local, global, naive]
      answers:
        description: Also score answers (facts, groundedness); more API calls
        default: true
        type: boolean
      rerank_model:
        description: Optional reranker, e.g. BAAI/bge-reranker-v2-m3
        default: ""
        type: string

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RERANK_MODEL: ${{ inputs.rerank_model }}
    steps:
      - name: Check for API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::error::Add an ANTHROPIC_API_KEY repository secret to run the evaluation."
          exit 1

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3-${{ inputs.rerank_model }}

      - name: Ingest samples
        run: uv run brag ingest samples/

      - name: Evaluate
        run: >-
          uv run brag eval eval/samples.yaml
          --mode ${{ inputs.mode }}
          ${{ inputs.answers && '--answers --min-facts 0.8 --min-groundedness 0.8' || '' }}
          --min-recall 0.9
          --output eval-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
